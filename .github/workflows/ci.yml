name: CI/CD Pipeline for Multi-Env Next.js

on:
  push:
    branches: [dev, sit, uat, master]
  pull_request:
    branches: [dev, sit, uat, master]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: yarn install

      - name: Lint
        run: yarn lint

      #  如果暂时不跑测试，这一段注释掉
      # - name:  Run tests
      #   if: github.ref_name == 'dev' || github.ref_name == 'sit'
      #   run: yarn test

      - name: Build project with correct env
        run: |
          echo "Building for branch: $GITHUB_REF_NAME"
          if [[ "$GITHUB_REF_NAME" == "dev" ]]; then
            yarn build:dev
          elif [[ "$GITHUB_REF_NAME" == "sit" ]]; then
            yarn build:sit
          elif [[ "$GITHUB_REF_NAME" == "uat" ]]; then
            yarn build:uat
          elif [[ "$GITHUB_REF_NAME" == "master" ]]; then
            yarn build:prod
          else
            echo "No build script for this branch"
            exit 1
          fi

      - name: Deploy to SIT
        if: github.ref_name == 'sit'
        run: echo "Deploying to SIT..."

      - name: Deploy to UAT (with approval)
        if: github.ref_name == 'uat'
        environment:
          name: uat #  和 GitHub 环境名一致
          url: https://uat.example.com
        run: echo "Deploying to UAT..."

      - name: Deploy to Production (with approval)
        if: github.ref_name == 'master'
        environment:
          name: production #  和 GitHub 环境名一致
          url: https://yourapp.com
        run: echo "Deploying to Production..."
