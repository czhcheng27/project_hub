name: CI/CD for Multi-Env Next.js

on:
  push:
    branches:
      - dev
      - sit
      - uat
      - master
  pull_request:
    branches:
      - dev
      - sit
      - uat
      - master

jobs:
  # 公共步骤，checkout + setup + install，其他 job 复用
  setup:
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.cache-deps.outputs.cache-hit }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v3
        with:
          path: ~/.yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install

  build-dev:
    needs: setup
    runs-on: ubuntu-latest
    if: github.ref_name == 'dev'
    steps:
      - name: Build for dev
        run: yarn build:dev

  build-sit:
    needs: setup
    runs-on: ubuntu-latest
    if: github.ref_name == 'sit'
    steps:
      - name: Build for sit
        run: yarn build:sit

  build-uat:
    needs: setup
    runs-on: ubuntu-latest
    environment:
      name: uat # 触发 UAT 环境的人工审批
      url: https://uat.yoursite.com
    if: github.ref_name == 'uat'
    steps:
      - name: Build for uat
        run: yarn build:uat

      - name: Deploy to UAT
        run: echo "Deploying to UAT environment..."

  deploy-prod:
    needs: setup
    runs-on: ubuntu-latest
    environment:
      name: production # 触发生产环境的人工审批
      url: https://www.yoursite.com
    if: github.ref_name == 'master'
    steps:
      - name: Build for prod
        run: yarn build:prod

      - name: Deploy to Production
        run: echo "Deploying to Production environment..."
